name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  # CI runs with NODE_ENV unset, which the panel treats as production, so the
  # config layer requires an explicit secret. This value is throwaway.
  CONFIG_SECRET: "KV/JjKrj8g6nNnvpQoViRs4QLLap5d9cRSwmMBOEdP4="
  SEED_ADMIN_EMAIL: "admin@ci.local"

jobs:
  node:
    name: Backend, shared and license server
    runs-on: ubuntu-latest
    env:
      # Keep the CI database out of the workspace tree.
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and schema push
        run: |
          pnpm db:generate
          pnpm db:push
      - name: Seed the super admin
        run: pnpm seed
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Prettier check
        run: pnpm lint
      - name: Unit tests (with coverage gate)
        run: pnpm test:coverage
      - name: Web build (Next.js standalone)
        # The console is a workspace package: typecheck/tests run above, but the
        # production build is a separate gate (Turbopack, RSC, route manifest).
        run: pnpm --filter @relayx/web build
      - name: License-server tests
        run: pnpm --filter @relayx/license-server test

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1: the openvpn package can block when every package runs in parallel
        run: go test -p 1 ./...
      - name: go build
        run: go build -o ../../dist/relayx-agent ./cmd/relayx-agent

  e2e:
    name: Live full-stack E2E
    runs-on: ubuntu-latest
    needs: [node, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/agent/go.mod
          cache-dependency-path: apps/agent/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run scripts/e2e-local.sh
        run: bash scripts/e2e-local.sh
