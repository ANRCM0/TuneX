name: MySQL target

# The replica runs on SQLite out of the box; `prisma/mysql/` is the MySQL target generated
# from the same models (see docs/MYSQL.md). SQLite can validate a schema, but only a real
# MySQL 8 can prove the DDL applies and the column types round-trip, so this workflow runs
# the whole MySQL path against a service container.
#
# What it proves:
#   1. the baseline migration applies to an empty MySQL 8 database;
#   2. `prisma migrate diff` finds no drift between migrations and the schema;
#   3. the whole backend vitest suite passes with the MySQL client
#      (`RELAYX_TEST_DIALECT=mysql`, dialect-aware harness in tests/helpers/temp-db.ts). Each
#      suite gets its own database created from the baseline DDL, so files still run in
#      parallel and every service and route the suite covers is exercised on MySQL;
#   4. a client generated from the MySQL schema round-trips JSON, enums, Float, DateTime
#      (millisecond precision), unique constraints and foreign-key actions;
#   5. the backend boots on that client and the aggregate endpoints — whose SQL is
#      dialect-switched in apps/backend/src/utils/date.ts — answer over HTTP with the
#      expected Asia/Shanghai buckets (`scripts/mysql-endpoints-smoke.mjs`).
#
# What it does NOT prove: paths that need a real Redis or a browser. The suite runs with the
# in-process Redis substitute, which is also the replica default. See docs/MYSQL.md §Known gaps.

on:
  push:
    branches: [master, main]
    paths:
      - "apps/backend/prisma/**"
      - "apps/backend/scripts/**"
      - "apps/backend/src/utils/date.ts"
      - "apps/backend/src/services/stats.ts"
      - "apps/backend/src/routes/**"
      - "tests/unit/date.test.ts"
      - "tests/unit/aggregate-dialect.test.ts"
      - "tests/helpers/**"
      - "tests/unit/mysql-workflow.test.ts"
      - ".github/workflows/mysql.yml"
  pull_request:
    paths:
      - "apps/backend/prisma/**"
      - "apps/backend/scripts/**"
      - "apps/backend/src/utils/date.ts"
      - "apps/backend/src/services/stats.ts"
      - "apps/backend/src/routes/**"
      - "tests/unit/date.test.ts"
      - "tests/unit/aggregate-dialect.test.ts"
      - "tests/helpers/**"
      - "tests/unit/mysql-workflow.test.ts"
      - ".github/workflows/mysql.yml"
  workflow_dispatch:

concurrency:
  group: mysql-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.7.0"
  MYSQL_DATABASE: relayx_ci
  MYSQL_ROOT_PASSWORD: ci-root-password
  # 127.0.0.1, not "mysql": the job's steps run on the runner host, the service is published.
  DATABASE_URL: "mysql://root:ci-root-password@127.0.0.1:3306/relayx_ci"

jobs:
  mysql:
    name: MySQL 8 (migrate + runtime smoke)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MySQL
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if node -e '
              const net = require("net");
              const s = net.connect(3306, "127.0.0.1");
              s.on("connect", () => { s.destroy(); process.exit(0); });
              s.on("error", () => process.exit(1));
            '; then
              echo "mysql is accepting connections"
              exit 0
            fi
            sleep 2
          done
          echo "mysql did not become reachable" >&2
          exit 1

      - name: Generate the MySQL schema variant (must be current)
        run: pnpm db:mysql:generate --check

      - name: Apply the baseline migration to an empty database
        run: pnpm db:mysql:deploy

      - name: Detect migration drift against the schema
        env:
          SHADOW_URL: "mysql://root:ci-root-password@127.0.0.1:3306/relayx_shadow"
        run: |
          set -euo pipefail
          # `migrate diff --from-migrations` needs a scratch database it can write to.
          printf 'CREATE DATABASE IF NOT EXISTS relayx_shadow;' \
            | npx prisma db execute --url "mysql://root:ci-root-password@127.0.0.1:3306/relayx_ci" --stdin
          DIFF="$(npx prisma migrate diff \
            --from-migrations apps/backend/prisma/mysql/migrations \
            --to-schema-datamodel apps/backend/prisma/mysql/schema.prisma \
            --shadow-database-url "$SHADOW_URL" \
            --script)"
          echo "$DIFF"
          if ! grep -q "empty migration" <<<"$DIFF"; then
            echo "MySQL migrations drifted from the schema" >&2
            exit 1
          fi

      - name: Generate a client from the MySQL schema
        run: npx prisma generate --schema apps/backend/prisma/mysql/schema.prisma

      - name: Backend test suite on MySQL (RELAYX_TEST_DIALECT=mysql)
        env:
          RELAYX_TEST_DIALECT: mysql
        run: pnpm test:mysql

      - name: Runtime smoke (JSON, enums, Float, DateTime, uniques, cascades)
        working-directory: apps/backend
        run: node scripts/mysql-smoke.mjs

      - name: Aggregate endpoints over HTTP (boots the backend on MySQL)
        working-directory: apps/backend
        env:
          NODE_ENV: test
          AUTH_MODE: local
          MYSQL_SMOKE_PORT: "3311"
        run: node scripts/mysql-endpoints-smoke.mjs

      - name: Drop isolation databases left by a failed suite
        if: always()
        working-directory: apps/backend
        env:
          NODE_ENV: test
        # A suite that crashed before its afterAll leaves relayx_t_* behind. The container goes
        # away with the job, but a local run should not accumulate databases either.
        run: node scripts/mysql-test-db.mjs sweep

      - name: Guard the dialect switch and the documented gaps
        run: |
          set -euo pipefail
          # Both branches are load-bearing: MySQL is the target this job proves, SQLite is
          # the default checkout. If either disappears, or the HTTP step is dropped while
          # docs/MYSQL.md still claims coverage, the job fails.
          grep -q "unixepoch" apps/backend/src/utils/date.ts
          grep -q "CONVERT_TZ" apps/backend/src/utils/date.ts
          grep -q "Known gaps" docs/MYSQL.md
          test -f apps/backend/scripts/mysql-endpoints-smoke.mjs
          grep -q "scripts/mysql-endpoints-smoke.mjs" .github/workflows/mysql.yml
          grep -q "pnpm test:mysql" .github/workflows/mysql.yml
          grep -q "RELAYX_TEST_DIALECT" tests/helpers/temp-db.ts
          grep -q "mysql-test-db.mjs" tests/helpers/temp-db.ts
          echo "both SQL dialects, the MySQL endpoint step and the documented gaps are present"
