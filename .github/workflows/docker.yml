name: Docker images

# Daily development: every push to master/main publishes `dev` and `dev-<sha>`.
# Release: a `v*` tag publishes 1.2.3, 1.2, 1 and latest.
#
# Images (GHCR, owner lower-cased automatically):
#   ghcr.io/<owner>/tunex-backend
#   ghcr.io/<owner>/tunex-agent
#   ghcr.io/<owner>/tunex-license-server
#
# linux/amd64 only. Add arm64 to `platforms` when arm nodes are needed; the agent
# builds multi-arch cleanly, the panel image doubles build time.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Resolve tag set
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: apps/backend/Dockerfile
          - component: agent
            context: apps/agent
            dockerfile: apps/agent/Dockerfile
          - component: license-server
            context: apps/license-server
            dockerfile: apps/license-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/tunex-${{ matrix.component }}
          tags: |
            type=raw,value=dev,enable=${{ needs.prepare.outputs.is_release == 'false' }}
            type=sha,format=short,prefix=dev-,enable=${{ needs.prepare.outputs.is_release == 'false' }}
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=semver,pattern={{major}},value=v${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_release == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true
