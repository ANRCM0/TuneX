packages:
  - "apps/*"
  - "packages/*"

# Native/binary dependencies whose install scripts must run.
# pnpm >= 11 reads build-script allowlists from this file, not from package.json.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
